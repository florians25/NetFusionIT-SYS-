# Optional overlay: docker compose -f compose.yaml -f deploy/compose.antivirus.yaml up -d
# Set ERP_CLAMAV_IMAGE to a reviewed official clamav/clamav image with immutable sha256 digest.
services:
  api:
    environment:
      ERP_CLAMAV_HOST: clamav
      ERP_CLAMAV_PORT: "3310"
  clamav:
    image: ${ERP_CLAMAV_IMAGE:?Set a reviewed clamav/clamav image with sha256 digest}
    restart: unless-stopped
    volumes:
      - clamav-definitions:/var/lib/clamav
    expose: ["3310"]
    security_opt: [no-new-privileges:true]
volumes:
  clamav-definitions:
