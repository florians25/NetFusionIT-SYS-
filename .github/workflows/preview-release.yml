name: Preview release
on:
  push:
    tags: ['v*-preview.*']
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UI5_DATA_DIR: ${{ runner.temp }}/ui5-cache
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-fund
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run einvoice:setup
      - run: npm run build
      - run: npm test
      - run: npm run test:browser:all
      - run: npm audit --omit=dev
      - name: Archive exact source version
        run: git archive --format=tar.gz --prefix=netfusion-erp/ --output="netfusion-erp-${GITHUB_REF_NAME}.tar.gz" HEAD
      - name: Publish tested prerelease and screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag --prerelease
          --title "NetFusion ERP $GITHUB_REF_NAME"
          --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          "netfusion-erp-${GITHUB_REF_NAME}.tar.gz"
          test-results/cockpit-desktop.png
          test-results/cockpit-mobile.png
          test-results/ticket-desktop.png
          test-results/ticket-sla.png
          test-results/planning-desktop.png
          test-results/planning-mobile.png
          test-results/service-master.png
          test-results/workflow-inbox.png
          test-results/workspace-desktop.png
          test-results/service-order.png
          test-results/order-pricing.png
          test-results/ticket-time.png
          test-results/ticket-time-mobile.png
          test-results/task-srm.png
          test-results/order-execution.png
          test-results/service-report-customer.png
          test-results/order-completed.png
          test-results/order-mobile.png
          test-results/journal-posted.png
          test-results/journal-reversal.png
          test-results/trial-balance.png
          test-results/journal-mobile.png
          test-results/purchase-order-create.png
          test-results/requisition-partial.png
          test-results/purchase-order-released.png
          test-results/procurement-flow.png
          test-results/order-procurement.png
          test-results/purchase-order-mobile.png
          test-results/material-availability.png
          test-results/material-stock-reserved.png
          test-results/material-shortage-requested.png
          test-results/material-arrived-reserved.png
          test-results/material-supply-mobile.png
          test-results/order-positions-expanded.png
          test-results/order-business-context.png
          test-results/warehouse-locations.png
          test-results/inventory-valuation.png
          test-results/goods-receipt-posted.png
          test-results/goods-receipt-reversal.png
          test-results/goods-receipt-journal.png
          test-results/goods-receipt-mobile.png
          test-results/number-series-desktop.png
          test-results/number-series-maintenance.png
          test-results/order-worklist-rich.png
          test-results/catalog-worklist-rich.png
          test-results/goods-receipt-quantity-entry.png
          test-results/service-delivery-quantity-entry.png
          test-results/service-delivery-partial.png
          test-results/service-delivery-reversal.png
          test-results/service-delivery-posted.png
          test-results/service-delivery-mobile.png
          test-results/ticket-material-issues.png
          test-results/service-report-material-actuals.png
