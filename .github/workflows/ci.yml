name: ERP validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      UI5_DATA_DIR: ${{ runner.temp }}/ui5-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run test:browser:all
      - run: npm audit --omit=dev
