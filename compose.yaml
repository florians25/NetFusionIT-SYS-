name: netfusion-erp
services:
  db:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random URL-safe postgres password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d erp"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build: .
    image: netfusion-erp:0.1.0
    command: [node, scripts/release.mjs]
    environment:
      DATABASE_URL: postgresql://erp_app:${ERP_DATABASE_PASSWORD:?Set a random URL-safe application DB password}@db:5432/erp
      ERP_MIGRATION_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/erp
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
  api:
    image: netfusion-erp:0.1.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ERP_HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://erp_app:${ERP_DATABASE_PASSWORD}@db:5432/erp
      ERP_SESSION_SECRET: ${ERP_SESSION_SECRET:?Set at least 48 random characters}
      ERP_PUBLIC_ORIGIN: https://${ERP_DOMAIN:?Set the ERP hostname}
      ERP_TRUST_PROXY: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ERP_DOMAIN: ${ERP_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
  bootstrap:
    image: netfusion-erp:0.1.0
    profiles: [setup]
    command: [node, scripts/bootstrap.mjs]
    environment:
      ERP_MIGRATION_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/erp
      ERP_BOOTSTRAP_TENANT: ${ERP_BOOTSTRAP_TENANT:-}
      ERP_BOOTSTRAP_COMPANY: ${ERP_BOOTSTRAP_COMPANY:-}
      ERP_BOOTSTRAP_NAME: ${ERP_BOOTSTRAP_NAME:-}
      ERP_BOOTSTRAP_EMAIL: ${ERP_BOOTSTRAP_EMAIL:-}
      ERP_BOOTSTRAP_PASSWORD: ${ERP_BOOTSTRAP_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
